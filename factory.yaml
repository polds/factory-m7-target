# M7 exit factory. The driver copies this tree and, in live modes, rewrites
# the model id. Offline keeps nous/claude-sonnet-5.5, which the in-cluster router answers.
schemaVersion: v1alpha1
name: m7
description: Operator-mode exit factory for one pull request and one cancel.
repositories:
  - codeForge: GITHUB
    owner: polds
    name: factory-m7-target
secrets:
  - GH_TOKEN
  - DEFINITION_GIT_URL
  - GITHUB_API_BASE
agentDefaults:
  model: nous/claude-sonnet-5.5
  runner: local
  pool: standard
  maxTurns: 8
